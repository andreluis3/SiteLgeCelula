      <h1>Laboratório de Usos Finais e Gestão de Energia (LGE)</h1>
      <p>O Laboratório de Usos Finais e Gestão de Energia do IPT atua em ensaios elétricos, compatibilidade eletromagnética, segurança elétrica, materiais elétricos e equipamentos ópticos.</p>
      <h2>Serviços e competências</h2>
      <ul>
        <li>Compatibilidade eletromagnética: emissão e imunidade eletromagnética.</li>
        <li>Segurança elétrica de equipamentos e materiais elétricos.</li>
        <li>Ensaios de rigidez dielétrica, constante dielétrica, tangente de perdas, resistividade superficial e volumétrica e tracking elétrico.</li>
        <li>Ensaios e calibração de equipamentos ópticos.</li>
      </ul>
